<div id="yarmarka-loading" style="padding:24px;text-align:center">Загрузка сайта ярмарки…</div>
<script>
(function(){
  var SITE_URL="https://REPLACE-WITH-VERIFIED-HTTPS-DEPLOYMENT.example";
  if(SITE_URL.indexOf("REPLACE-WITH")!==-1){
    document.getElementById("yarmarka-loading").textContent="Загрузчик не настроен: нужен проверенный HTTPS-адрес.";
    return;
  }
  var frame=document.createElement("iframe");
  frame.src=SITE_URL;
  frame.title="Ярмарка «4 сезона»";
  frame.loading="eager";
  frame.style.cssText="display:block;width:100%;min-height:100vh;border:0";
  document.getElementById("yarmarka-loading").replaceWith(frame);
  window.addEventListener("message",function(e){
    if(e.origin!==new URL(SITE_URL).origin)return;
    if(e.data&&e.data.type==="yarmarka-height"&&Number.isFinite(e.data.height))
      frame.style.height=Math.max(600,Math.ceil(e.data.height))+"px";
  });
})();
</script>
