<!-- Tilda T123: verified bridge with per-page iframe scroll restoration. -->
<div id="yarmarka-host"><div style="padding:24px;text-align:center">Загрузка ярмарки «4 сезона»…</div></div>
<script>
(function () {
  'use strict';
  var host = document.getElementById('yarmarka-host');
  var siteUrl = 'https://mozgikom-commits.github.io/yarmarka-4-sezona/?v=20261119-2';
  var trustedOrigin = new URL(siteUrl).origin;
  if (!host) return;

  var frame = document.createElement('iframe');
  frame.title = 'Ярмарка «4 сезона»';
  frame.src = siteUrl;
  frame.loading = 'eager';
  frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  frame.style.cssText = 'display:block;width:100%;height:100vh;min-height:650px;border:0;background:#fff9ee';
  host.replaceChildren(frame);

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  var pagePositions = Object.create(null);
  var currentPage = '';
  var pendingRestore = null;

  function frameTop() {
    return frame.getBoundingClientRect().top + window.scrollY;
  }
  function resetToPageTop(resetHeight) {
    pendingRestore = null;
    if (resetHeight) frame.style.height = Math.max(650, window.innerHeight) + 'px';
    window.scrollTo({ top: Math.max(0, Math.round(frameTop())), behavior: 'auto' });
  }
  var outerNavigation = window.performance?.getEntriesByType('navigation')[0];
  if (outerNavigation?.type === 'reload') {
    window.addEventListener('pageshow', function () {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { resetToPageTop(false); });
      });
    }, { once: true });
  }

  function restorePagePosition(position) {
    pendingRestore = Math.max(0, Math.round(position));
    requestAnimationFrame(function () {
      if (pendingRestore === null) return;
      var maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      if (pendingRestore <= maxScroll + 1) {
        window.scrollTo({ top: pendingRestore, behavior: 'auto' });
        pendingRestore = null;
      }
    });
  }
  function applyPendingRestore() {
    if (pendingRestore !== null) restorePagePosition(pendingRestore);
  }

  window.addEventListener('message', function (event) {
    if (event.source !== frame.contentWindow || event.origin !== trustedOrigin) return;
    var data = event.data;
    if (!data || typeof data.type !== 'string') return;

    if (data.type === 'yarmarka-page-navigation') {
      if (data.from) pagePositions[data.from] = window.scrollY;
      if (data.to && !Object.prototype.hasOwnProperty.call(pagePositions, data.to)) pagePositions[data.to] = 0;
      currentPage = data.to || '';
      resetToPageTop(true);
      return;
    }
    if (data.type === 'yarmarka-page-ready') {
      currentPage = data.page || currentPage;
      if (data.navigationType === 'back_forward' && currentPage
        && Object.prototype.hasOwnProperty.call(pagePositions, currentPage)) {
        pendingRestore = pagePositions[currentPage];
        applyPendingRestore();
      } else {
        if (currentPage) pagePositions[currentPage] = 0;
        resetToPageTop(true);
      }
      return;
    }
    if (data.page && currentPage && data.page !== currentPage) return;
    if (data.type === 'yarmarka-height' && Number.isFinite(data.height)) {
      frame.style.height = Math.max(650, Math.ceil(data.height) + 4) + 'px';
      applyPendingRestore();
      return;
    }
    if (data.type === 'yarmarka-scroll' && Number.isFinite(data.top)) {
      var target = Math.max(0, Math.round(frameTop() + data.top));
      if (data.page) pagePositions[data.page] = target;
      window.scrollTo({ top: target, behavior: 'smooth' });
    }
  });
})();
</script>
